name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on release tags like v1.0.0
  workflow_dispatch: # Enable manual build trigger via GitHub Actions Web UI

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r python_service/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suites
        run: |
          pnpm run test:frontend
          pytest tests/python

      - name: Build and Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Give every tag build a unique, monotonically increasing build
          # number; without this every installer was literally 1.0.0.
          BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm run package:win

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $buildDirs = Get-ChildItem dist -Directory | Where-Object { $_.Name -ne 'win-unpacked' }
          foreach ($dir in $buildDirs) {
            $unpacked = Join-Path $dir.FullName "win-unpacked"
            if (Test-Path $unpacked) {
              $zipPath = Join-Path $dir.FullName "MT5-Trader-Workbench-$($dir.Name)-Portable.zip"
              Write-Host "Compressing $unpacked to $zipPath..."
              Compress-Archive -Path "$unpacked\*" -DestinationPath $zipPath -Force
            }
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MT5-Trader-Workbench-Build-Outputs
          path: |
            dist/*/*Setup*.exe
            dist/*/*Portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*/*Setup*.exe
            dist/*/*Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
